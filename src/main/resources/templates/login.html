<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>
    <title>Login page</title>
</head>
<body>
<div class="container-sm">
    <div class="card">
        <h5 class="card-header">Wishlist</h5>
        <div class="card-body">
            <div class="container" style="display: flex">
            <h5 class="card-title">Find ønskeliste</h5>
                <div class="form-group">
                    <input type="email" class="form-control" id="exampleInputEmail1" aria-describedby="emailHelp" placeholder="Indtast dit ønskeliste URL">
                </div>
    </div>
    </div>

        <div class="card">
            <h5 class="card-header">Opret ønskeliste</h5>
            <h5 class="card-title">Klik for at oprette et ønske</h5>
            <form action="#" th:action="@{/reserve/{wish}(wish=${wishlist.createWish})}" th:object="${wishlist}" method="post">
                <button type="submit" class="btn btn-primary">Opret ønske</button>
            </form>
        </div>




</div>





</body>
</html>
