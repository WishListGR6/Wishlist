<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Rediger ønske – Ønskelisten</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div th:insert="~{fragments :: header}"></div>

<div class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card form-card">
                <div class="card-header">Rediger ønske</div>
                <div class="card-body p-4">
                    <form action="#" th:action="@{/wishlist/edit/{name}(name=${wish.name})}" th:object="${wish}" method="post">
                        <div class="mb-3">
                            <label for="name" class="form-label">Navn</label>
                            <input type="text" class="form-control" id="name" th:field="*{name}" required>
                        </div>
                        <div class="mb-3">
                            <label for="description" class="form-label">Beskrivelse</label>
                            <input type="text" class="form-control" id="description" th:field="*{description}">
                        </div>
                        <div class="mb-3">
                            <label for="productURL" class="form-label">Link til produkt</label>
                            <input type="text" class="form-control" id="productURL" th:field="*{productURL}" placeholder="https://...">
                        </div>
                        <div class="mb-3">
                            <label for="price" class="form-label">Pris (kr)</label>
                            <input type="number" class="form-control" id="price" th:field="*{price}">
                        </div>
                        <div class="mb-3">
                            <label for="comments" class="form-label">Kommentarer</label>
                            <input type="text" class="form-control" id="comments" th:field="*{comments}">
                        </div>
                        <div class="mb-4">
                            <label for="events" class="form-label">Event</label>
                            <select class="form-select" id="events" name="eventNames" multiple>
                                <option th:each="event: ${events}" th:unless="${event.title() == 'No event'}" th:value="${event.title()}" th:text="${event.title()}" th:selected="${wish.events.contains(event)}"></option>
                            </select>
                        </div>

                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-brand flex-grow-1">Opdater ønske</button>
                            <a th:href="@{/wishlist}" class="btn btn-outline-secondary">Annuller</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
