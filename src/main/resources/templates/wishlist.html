<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Ønskelisten</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div th:insert="~{fragments :: header}"></div>

<div class="container pb-5">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="mb-0" th:text="${session.wishlist != null ? session.wishlist.name : 'Min ønskeliste'}">Min ønskeliste</h2>
            <small class="text-muted" th:if="${session.isOwner}">Liste-ID: <span th:text="${session.listID}"></span></small>
        </div>
        <div class="d-flex gap-2" th:if="${session.isOwner}">
            <a th:href="@{/createWish}" class="btn btn-brand">+ Tilføj ønske</a>
            <a th:href="@{/wishlist/share}" class="btn btn-outline-secondary">Del liste</a>
        </div>
    </div>

    <div th:if="${session.wishlist != null and !session.wishlist.events.isEmpty()}" class="mb-4">
        <div class="d-flex flex-wrap gap-2 align-items-center">
            <span class="text-muted me-1" style="font-size: 0.88rem;">Filter:</span>
            <span th:each="event: ${session.wishlist.events}"
                  th:if="${event.title != 'No event'}"
                  class="event-pill"
                  th:attr="data-event=${event.title}"
                  th:text="${event.title}">Event</span>
        </div>
    </div>

    <div th:if="${session.wishlist == null or session.wishlist.wishes.isEmpty()}" class="text-center py-5">
        <div style="font-size: 3rem;">🎀</div>
        <h5 class="mt-3 text-muted">Ingen ønsker endnu</h5>
        <p class="text-muted" th:if="${session.isOwner}">Klik på "Tilføj ønske" for at komme i gang.</p>
        <p class="text-muted" th:if="${!session.isOwner}">Ejeren har ikke tilføjet ønsker endnu.</p>
    </div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" th:if="${session.wishlist != null and !session.wishlist.wishes.isEmpty()}">
        <div class="col wish-col"
             th:each="element: ${session.wishlist.wishes}"
             th:attr="data-events=${#strings.listJoin(element.events.![title], ',')}">
            <div class="card wish-card h-100" th:classappend="${element.isReserved()} ? 'is-reserved'">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span th:text="${element.name}">Ønskenavn</span>
                    <span class="reserved-badge" th:if="${element.isReserved()}">Reserveret ✓</span>
                </div>
                <div class="card-body">
                    <p class="card-text text-muted mb-2" th:if="${element.description != null and !element.description.isEmpty()}" th:text="${element.description}"></p>
                    <p class="card-text mb-1" th:if="${element.price > 0}">
                        <strong>Pris:</strong> <span th:text="${element.price}"></span> kr
                    </p>
                    <p class="card-text mb-1" th:if="${element.comments != null and !element.comments.isEmpty()}">
                        <strong>Kommentar:</strong> <span th:text="${element.comments}"></span>
                    </p>
                    <a th:if="${element.productURL != null and !element.productURL.isEmpty()}"
                       th:href="${element.productURL}" target="_blank" rel="noopener"
                       class="btn btn-sm btn-outline-secondary mt-2">Se produkt</a>
                </div>
                <div class="card-footer bg-white border-top-0 pt-0">
                    <div th:if="${session.isOwner}" class="d-flex gap-2">
                        <a th:href="@{/wishlist/edit/{wishName}(wishName=${element.name})}" class="btn btn-sm btn-brand">Rediger</a>
                        <a th:href="@{/wishlist/deleteConfirmation/{wishName}(wishName=${element.name})}" class="btn btn-sm btn-outline-danger">Slet</a>
                    </div>
                    <div th:if="${!session.isOwner and !element.isReserved()}">
                        <form action="#" th:action="@{/wishlist/reserve/{wishName}(wishName=${element.name})}" method="post">
                            <button type="submit" class="btn btn-sm btn-brand w-100">Reservér</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>

<script>
    const activeFilters = new Set();

    document.querySelectorAll('.event-pill').forEach(pill => {
        pill.addEventListener('click', () => {
            const event = pill.getAttribute('data-event');
            if (activeFilters.has(event)) {
                activeFilters.delete(event);
                pill.classList.remove('active');
            } else {
                activeFilters.add(event);
                pill.classList.add('active');
            }
            applyFilter();
        });
    });

    function applyFilter() {
        document.querySelectorAll('.wish-col').forEach(col => {
            if (activeFilters.size === 0) {
                col.style.display = '';
                return;
            }
            const cardEvents = (col.getAttribute('data-events') || '').split(',').filter(Boolean);
            const matches = [...activeFilters].some(f => cardEvents.includes(f));
            col.style.display = matches ? '' : 'none';
        });
    }
</script>
</body>
</html>
