<!DOCTYPE html>
<html lang="da" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Slet ønske – Ønskelisten</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
<div th:insert="~{fragments :: header}"></div>

<div class="container pb-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card form-card text-center">
                <div class="card-body p-5">
                    <div style="font-size: 2.5rem;" class="mb-3">🗑️</div>
                    <h5 class="mb-2">Slet ønske</h5>
                    <p class="text-muted mb-4">Er du sikker på, at du vil slette <strong th:text="${wishName}">"dette ønske"</strong>? Dette kan ikke fortrydes.</p>
                    <form action="#" th:action="@{/wishlist/delete/{wishName}(wishName=${wishName})}" method="post" class="d-flex gap-2 justify-content-center">
                        <button type="submit" class="btn btn-danger">Slet</button>
                        <a th:href="@{/wishlist}" class="btn btn-outline-secondary">Fortryd</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
